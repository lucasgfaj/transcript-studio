<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Transcrição e atas de reuniões, 100% local" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcript Studio</title>
    <script>
      // Apply the saved theme before React loads, avoiding a light flash in dark mode.
      try {
        const t = localStorage.getItem("theme")
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
