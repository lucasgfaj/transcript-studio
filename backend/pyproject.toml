[project]
name = "transcript-studio"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "av>=11,<16",
    "fastapi[standard]>=0.148.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
]

[project.scripts]
transcript-studio = "transcript_studio:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
